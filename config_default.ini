[nfs]
audio = audio
plugins = plugins
motion_manager = motion_manager

[scanner]
controller = grbl_streamer
feed_rate = 35000
cal_tool_height = 30.0
verify_controller_on_connect = True

[motion_manager]
type = CylindricalMeasurementMotionManager
safe_radius = 100.0
measurement_points_type = FileMeasurementPoints
filename = HALS_Project_grid.csv
homing_gap = 0.0
pole_gap = 0.0

[plugins]
plugin_1 = nfs.plugins.cylindrical_measurement_points
plugin_2 = nfs.plugins.spherical_measurement_points
plugin_3 = nfs.plugins.spherical_measurement_points_sorted
plugin_4 = nfs.plugins.spherical_measurement_points_arcs
plugin_5 = nfs.plugins.spherical_measurement_points_arcs_random
plugin_6 = nfs.plugins.file_measurement_points

[grbl_streamer]
type = Arduino
baudrate = 115200
mock_linear_speed_mm_s = 300.0
mock_angular_speed_deg_s = 15.0
mock_status_hz = 5.0

[windows]
port = COM5

[linux]
port = /dev/ttyGRBL

[audio]
mode = hardware
in_dev = 4
out_dev = 4
in_ch_mic = 0
in_ch_loop = 1
out_ch_spkr = 0
out_ch_ref = 1
fs = 48000
blocksize = 2048
wasapi_exclusive = True
in_dev_name = ASIO4ALL v2
in_dev_hostapi = ASIO
out_dev_name = ASIO4ALL v2
out_dev_hostapi = ASIO

[sweep]
naming_convention = dimitri
sweep_dur_s = 1.5
sweep_level_dbfs = -16.0
num_sweeps = 2
protect_hpf_hz = None
protect_hpf_order = 1
protect_hpf_correction = True
protect_hpf_corr_db_cap = 12.0
align_to_first_marker = False
pre_sil_ms = 500.0
post_sil_ms = 500.0
mic_tail_taper_ms = 20.0
debug_saves = True
h2_test_db = None
h3_test_db = None

[logging]
level = ERROR
file = scanner.log
rotation = 100 MB
retention = 1 week

[live_capture]
panel_order = Audio Meters, Measurement Positions, Frequency Response, 3D Progress, Impulse Response
visible_panels = Audio Meters, Measurement Positions, Frequency Response, 3D Progress, Impulse Response
frequency_smoothing_fraction = 24

[app]
show_machine_coordinate_system = True
coord_viewer_backend = pyvista
use_matplotlib_live_plots = False
show_rehome_button = False
show_height_offset_controls = False
use_alternative_motion_controls = False
auto_hide_left_menu = True
default_project_dir = HALS_Projects

[debug]
direct_progress_ui = False
in_app_log_viewer = False
serial_comms = False
deep_ui_diagnostics = True

