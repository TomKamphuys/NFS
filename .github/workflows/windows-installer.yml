# Builds a standalone Windows installer for the HALS Near Field Scanner.
#
# The result is a single "HALS-Near-Field-Scanner-Setup-<version>.exe" that an
# end user (an audio enthusiast, not a developer) can download and run. It
# bundles Python and every dependency, so users never have to install Python,
# uv, or manage virtual environments.
#
# Pipeline:
#   1. Install the project with uv on a Windows runner.
#   2. Freeze the Qt application into a self-contained folder with PyInstaller.
#   3. Wrap that folder into a friendly installer with Inno Setup.
#   4. Publish the installer as a build artifact, and attach it to the GitHub
#      Release when the workflow is triggered by a version tag (e.g. v0.2.1).
#
# It runs in three situations:
#   * on every push to "master" (and on pull requests targeting it) so we
#     always know the installer still builds; the result is kept as a
#     downloadable build artifact (not attached to any release).
#   * when a version tag like "v0.2.1" is pushed, in which case the installer
#     is additionally attached to the matching GitHub Release.
#   * manually from the Actions tab (workflow_dispatch) to produce a test
#     installer on demand.

name: Windows Installer

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project and PyInstaller
        run: uv sync --locked --all-extras --dev --no-editable

      - name: Add PyInstaller
        run: uv pip install pyinstaller

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF
          $content = Get-Content pyproject.toml -Raw
          $match = [regex]::Match($content, '(?m)^\s*version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "Could not read project version from pyproject.toml" }
          $projectVersion = $match.Groups[1].Value
          if ($ref -like "refs/tags/v*") {
            $version = $ref -replace "refs/tags/v", ""
            if ($version -ne $projectVersion) {
              throw "Tag version $version does not match pyproject.toml version $projectVersion"
            }
          } else {
            $version = $projectVersion
          }
          Write-Host "Resolved version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build executable with PyInstaller
        run: uv run --no-sync pyinstaller packaging/hals.spec --noconfirm --clean

      - name: Verify frozen executable against stale metadata
        shell: pwsh
        run: |
          $verificationDir = Join-Path $env:RUNNER_TEMP "HALS-version-check"
          New-Item -ItemType Directory -Path $verificationDir -Force | Out-Null
          Copy-Item -Path "dist\HALS Near Field Scanner\*" -Destination $verificationDir -Recurse -Force
          $metadataDirectory = Join-Path $verificationDir "_internal"
          if (-not (Test-Path -LiteralPath $metadataDirectory)) { $metadataDirectory = $verificationDir }
          $metadataDir = Get-ChildItem -LiteralPath $metadataDirectory -Directory -Filter "nfs-*.dist-info" | Select-Object -First 1
          if (-not $metadataDir) { throw "Bundled nfs distribution metadata was not found under $metadataDirectory" }
          $metadataFile = Join-Path $metadataDir.FullName "METADATA"
          if (-not (Test-Path -LiteralPath $metadataFile)) { throw "Bundled metadata file was not found at $metadataFile" }
          Write-Host "Verifying with bundled metadata at $metadataFile"
          $metadata = Get-Content -LiteralPath $metadataFile -Raw
          $staleMetadata = [regex]::Replace($metadata, '(?m)^Version: [^\r\n]+', 'Version: 0.2.1')
          if ($staleMetadata -eq $metadata) { throw "Could not set stale nfs metadata for verification" }
          Set-Content -LiteralPath $metadataFile -Value $staleMetadata -Encoding utf8
          $executable = Join-Path $verificationDir "HALS Near Field Scanner.exe"
          $versionReport = Join-Path $verificationDir "actual-version.txt"
          $verificationProcess = Start-Process -FilePath $executable -ArgumentList @(
            "--verify-version",
            "${{ steps.version.outputs.version }}",
            "--report",
            $versionReport
          ) -Wait -PassThru
          if (-not (Test-Path -LiteralPath $versionReport)) {
            throw "Frozen executable did not create its version report (exit code $($verificationProcess.ExitCode))"
          }
          $actualVersion = Get-Content -LiteralPath $versionReport -Raw
          if ($verificationProcess.ExitCode -ne 0) {
            throw "Frozen executable reported '$actualVersion' instead of ${{ steps.version.outputs.version }} (exit code $($verificationProcess.ExitCode))"
          }
          Write-Host "Frozen executable verified as version $actualVersion despite stale 0.2.1 metadata"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer with Inno Setup
        run: iscc /DMyAppVersion=${{ steps.version.outputs.version }} packaging\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALS-Near-Field-Scanner-Setup
          path: dist/installer/*.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
