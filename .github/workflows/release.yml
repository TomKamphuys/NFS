# Builds the distributable package (wheel + sdist) and attaches the
# artifacts to a GitHub Release. This is the recommended distribution
# route for this project because it is a GUI/hardware tool distributed to
# people with repo access rather than a public PyPI library.
#
# How to cut a release:
#   1. Bump "version" in pyproject.toml (e.g. 0.2.1).
#   2. Commit, then create and push a matching tag:
#        git tag v0.2.1
#        git push origin v0.2.1
#   3. This workflow builds nfs-<version>-py3-none-any.whl and
#      nfs-<version>.tar.gz and publishes them on a GitHub Release.
#
# You can also run it manually from the Actions tab (workflow_dispatch);
# in that case the artifacts are only uploaded as build artifacts, not
# attached to a release.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
