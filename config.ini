[nfs]
audio = audio
plugins = plugins
motion_manager = motion_manager

[scanner]
controller = grbl_streamer
feed_rate = 35000

[motion_manager]
type = CylindricalMeasurementMotionManager
safe_radius = 100.0
measurement_points_type = FileMeasurementPoints
filename = jan_cylinder_grid1.csv
homing_gap = 0.0
pole_gap = 0.0

[plugins]
plugin_1 = nfs.plugins.cylindrical_measurement_points
plugin_2 = nfs.plugins.spherical_measurement_points
plugin_3 = nfs.plugins.spherical_measurement_points_sorted
plugin_4 = nfs.plugins.spherical_measurement_points_arcs
plugin_5 = nfs.plugins.spherical_measurement_points_arcs_random
plugin_6 = nfs.plugins.file_measurement_points

[grbl_streamer]
type = Arduino
baudrate = 115200

[windows]
port = COM5

[linux]
port = /dev/ttyGRBL

[audio]
mode = mock_interface
in_dev = 21
out_dev = 21
in_ch_mic = 0
in_ch_loop = 1
out_ch_spkr = 0
out_ch_ref = 1
fs = 48000
blocksize = 2048
wasapi_exclusive = True

[sweep]
naming_convention = dimitri
sweep_dur_s = 5.0
sweep_level_dbfs = -3.0
num_sweeps = 2
protect_hpf_hz = None
protect_hpf_order = 2
protect_hpf_correction = True
protect_hpf_corr_db_cap = 12.0
align_to_first_marker = False
pre_sil_ms = 500.0
post_sil_ms = 500.0
mic_tail_taper_ms = 20.0
debug_saves = True
h2_test_db = None
h3_test_db = None

[logging]
level = TRACE
file = scanner.log
rotation = 100 MB
retention = 1 week

